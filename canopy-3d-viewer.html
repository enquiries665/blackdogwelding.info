<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blackdog Welding | 3D Model</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202226;color:#fff;font:14px Arial,sans-serif}#status{position:absolute;top:14px;left:14px;right:14px;z-index:3;background:#101113e8;padding:12px;border-radius:6px;max-width:600px;line-height:1.5}#hint{position:absolute;bottom:14px;left:14px;z-index:2;background:#101113dd;padding:10px;border-radius:5px}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head><body><div id="status" role="status">Starting 3D viewer…</div><div id="hint">Drag to rotate · Scroll to zoom · Preview only — fitment unverified</div>
<script>
const statusEl=document.getElementById('status');
window.addEventListener('error',e=>{statusEl.textContent='Viewer error: '+(e.message||'Unable to start 3D viewer')});
window.addEventListener('unhandledrejection',e=>{statusEl.textContent='Viewer error: '+(e.reason?.message||String(e.reason))});
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const status=document.getElementById('status');
try {
const scene=new THREE.Scene();scene.background=new THREE.Color(0x202226);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.01,100000);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x737c89,3));
const directional=new THREE.DirectionalLight(0xffffff,3);directional.position.set(4,7,8);scene.add(directional);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
status.textContent='Loading 3D model…';
const url='./blackdog-canopy-model.glb';
const response=await fetch(url,{cache:'no-store'});
if(!response.ok)throw new Error('Cannot download '+url+' (HTTP '+response.status+'). Confirm the file is in the same GitHub folder as this viewer.');
const contentType=response.headers.get('content-type')||'';
const data=await response.arrayBuffer();
if(data.byteLength<100)throw new Error('Model file is empty or not a GLB.');
const bytes=new Uint8Array(data,0,4);
if(String.fromCharCode(...bytes)!=='glTF')throw new Error('The URL returned a webpage instead of a GLB model. Check its filename and upload location.');
const gltf=await new GLTFLoader().parseAsync(data,new URL('./',location.href).href);
const object=gltf.scene;scene.add(object);
const bounds=new THREE.Box3().setFromObject(object);if(bounds.isEmpty())throw new Error('Model contains no visible geometry.');
const center=bounds.getCenter(new THREE.Vector3());const size=bounds.getSize(new THREE.Vector3());
object.position.sub(center);
const radius=Math.max(size.x,size.y,size.z);const distance=radius/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))*1.6;
camera.position.set(distance*.85,distance*.6,distance*.95);camera.near=Math.max(.01,distance/10000);camera.far=distance*100;camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.update();
status.textContent='3D model loaded · Drag to rotate';
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(e){console.error(e);status.textContent='3D viewer problem: '+(e.message||String(e));}
</script></body></html>
