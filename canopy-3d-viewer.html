<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blackdog 3D model preview</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202226;color:#eee;font:14px Arial}#hint{position:absolute;left:12px;bottom:12px;background:#101113cc;padding:10px 12px;border-radius:5px;pointer-events:none}#status{position:absolute;top:12px;left:12px;background:#101113cc;padding:9px;border-radius:4px}canvas{display:block}</style></head><body><div id="status">Loading supplied 3D model…</div><div id="hint">Drag to rotate · Scroll to zoom · Model preview only — fitment unverified</div><script type="module">
import * as THREE from 'https://esm.sh/three@0.160.1';
import {OrbitControls} from 'https://esm.sh/three@0.160.1/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://esm.sh/three@0.160.1/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x202226);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,5000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x6b7180,2.3));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(3,7,5);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;const status=document.getElementById('status');new GLTFLoader().load('blackdog-canopy-model.glb',g=>{const obj=g.scene;scene.add(obj);const bounds=new THREE.Box3().setFromObject(obj);const center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3()),max=Math.max(size.x,size.y,size.z);obj.position.sub(center);controls.target.set(0,0,0);camera.position.set(max*1.4,max*.9,max*1.5);camera.near=Math.max(.01,max/1000);camera.far=max*100;camera.updateProjectionMatrix();controls.update();status.textContent='Supplied OBJ model · 3D preview';},p=>{if(p.total)status.textContent='Loading 3D model '+Math.round(p.loaded/p.total*100)+'%';},e=>{status.textContent='Model could not load. Check the GLB file is uploaded.';console.error(e)});function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
