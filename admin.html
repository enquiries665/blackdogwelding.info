<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blackdog order approvals</title><body style="background:#111;color:white;font:16px Arial;padding:25px"><h1>Blackdog order approvals</h1><p><a href="parts-admin.html" style="color:#f47b20">Manage spare parts & orders →</a></p><p>Private admin screen. Enter the ADMIN_TOKEN configured in Netlify. Do not share it.</p><input id="pass" type="password" placeholder="Admin token" style="padding:12px;width:min(450px,90%)"><button id="load">Load requests</button><p id="message"></p><div id="orders"></div><script>
const el=id=>document.getElementById(id),auth=()=>({'Authorization':'Bearer '+el('pass').value});
async function load(){const r=await fetch('/api/admin/requests',{headers:auth()}),d=await r.json();if(!Array.isArray(d)){el('message').textContent=d.error||'Unable to load';return}el('message').textContent=d.length+' order requests';el('orders').replaceChildren();d.forEach(o=>{const section=document.createElement('section');section.style='border:1px solid #555;margin:20px 0;padding:16px;line-height:1.9';const desc=document.createElement('p');desc.textContent=[o.id,o.status,o.customerEmail,o.year+' '+o.make+' '+o.model,o.cab,o.product,o.fulfilment,'Postcode: '+o.postcode,'Tank: '+o.tank,'Lights: '+o.lights,'D-rings: '+o.eyes,'Bespoke boxes: '+o.boxes].join(' | ');section.append(desc);if(o.status==='pending'){
 const field=(label,value='0')=>{const wrapper=document.createElement('label');wrapper.style='display:block;margin:8px 0';wrapper.textContent=label+' ';const input=document.createElement('input');input.type='number';input.min='0';input.step='0.01';input.value=value;input.style='padding:8px';wrapper.append(input);section.append(wrapper);return input};
 const delivery=field('Delivery ex VAT (£)');const base=o.cab!=='Double Cab'?field('Agreed quoted base ex VAT (£)',o.product==='tray'?'4650':'7850'):null;const boxes=o.boxes?field('Agreed bespoke storage boxes ex VAT (£)'):null;
 const btn=document.createElement('button');btn.textContent='Confirm fitment, pricing and approve';btn.style='padding:12px;background:#f47b20;border:0';btn.onclick=async()=>{if(!confirm('Have you confirmed compatibility, final product price, extras, fitting or delivery, and lead time with the customer?'))return;btn.disabled=true;const payload={fitmentConfirmed:true,deliveryConfirmed:o.fulfilment==='deliver',deliveryPounds:Number(delivery.value)};if(base)payload.customBasePounds=Number(base.value);if(boxes)payload.boxesPounds=Number(boxes.value);const r=await fetch('/api/admin/approve/'+o.id,{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(d.checkoutUrl){const p=document.createElement('p');p.textContent='Approved. Copy this PRIVATE payment link and send it to '+o.customerEmail+': ';const a=document.createElement('a');a.href=d.checkoutUrl;a.textContent=d.checkoutUrl;a.style='color:#f47b20;overflow-wrap:anywhere';p.append(a);section.append(p);btn.remove()}else{alert(d.error||'Approval failed');btn.disabled=false}};section.append(btn)
 }el('orders').append(section)})};el('load').onclick=load;
</script></body></html>
