<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure payment | Blackdog Welding</title><style>body{background:#111;color:white;font:16px Arial;max-width:680px;margin:70px auto;padding:20px}h1{color:#f47b20}button{padding:16px 24px;background:#f47b20;border:0;font-weight:bold;cursor:pointer}p{line-height:1.7}</style><h1>BLACKDOG WELDING</h1><h2>Approved order checkout</h2><div id="details">Loading your approved order…</div><p>Current estimated manufacturing lead time: <b>3.5 months from order confirmation.</b></p><label><input type="checkbox" id="ack"> I acknowledge the estimated 3.5-month lead time.</label><p><button id="pay" disabled>Pay securely with Stripe</button></p><p id="msg"></p><script>const p=new URLSearchParams(location.search),id=p.get('id'),token=p.get('token'),fmt=n=>(n/100).toLocaleString('en-GB',{style:'currency',currency:'GBP'});fetch('/api/approved/'+encodeURIComponent(id)+'?token='+encodeURIComponent(token)).then(r=>r.json()).then(d=>{if(d.error)throw Error(d.error);document.getElementById('details').innerHTML='<p>'+d.vehicle.replaceAll('<','&lt;')+'</p><p>Subtotal: '+fmt(d.subtotalPence)+'<br>VAT: '+fmt(d.vatPence)+'<br><strong>Total: '+fmt(d.totalPence)+'</strong></p>';if(d.status==='paid')document.getElementById('msg').textContent='This order has already been paid.';else document.getElementById('ack').onchange=e=>document.getElementById('pay').disabled=!e.target.checked}).catch(e=>document.getElementById('details').textContent=e.message);document.getElementById('pay').onclick=async()=>{document.getElementById('pay').disabled=true;const r=await fetch('/api/checkout/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,leadTimeAccepted:document.getElementById('ack').checked})});const d=await r.json();if(d.url)location.href=d.url;else{document.getElementById('msg').textContent=d.error||'Checkout unavailable';document.getElementById('pay').disabled=false}};</script></html>
