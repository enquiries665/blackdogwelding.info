<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status | Blackdog Welding</title><style>body{background:#101112;color:#f6f6f4;font-family:Arial,sans-serif;max-width:640px;margin:12vh auto;padding:25px}h1{color:#f47b20}a{color:#f47b20}</style></head><body><h1>BLACKDOG WELDING</h1><h2 id="title">Checking payment status…</h2><p id="detail">Please wait while we verify your Stripe payment.</p><p><a href="shop.html">Return to shop</a></p><script>(async()=>{const id=new URLSearchParams(location.search).get('session_id');if(!id){document.getElementById('title').textContent='No payment reference';return}try{const r=await fetch('/.netlify/functions/check-payment?session_id='+encodeURIComponent(id));const data=await r.json();if(!r.ok)throw Error(data.error||'Unable to verify');document.getElementById('title').textContent=data.paid?'Payment received':'Payment not yet confirmed';document.getElementById('detail').textContent=data.paid?'Thank you. Your payment has been confirmed. Please retain your Stripe receipt. Blackdog Welding will contact you to confirm vehicle fitment and production details. Reference: '+(data.reference||id):'We cannot confirm your payment yet. Check your Stripe receipt or contact enquiries@blackdogwelding.info before trying again.'}catch(e){document.getElementById('title').textContent='Payment verification unavailable';document.getElementById('detail').textContent='Please check your Stripe receipt or contact enquiries@blackdogwelding.info. Do not pay again until your payment is checked.'}})();</script></body></html>
